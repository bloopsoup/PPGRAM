<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPGRAM%</title>

    <link rel="stylesheet" type="text/css" href="scripts/display/styles.css">

    <link rel="stylesheet" type="text/css" href="styles/animations.css">
    <link rel="stylesheet" type="text/css" href="styles/containers.css">
    <link rel="stylesheet" type="text/css" href="styles/elements.css">
    <link rel="stylesheet" type="text/css" href="styles/fonts.css">
    <link rel="stylesheet" type="text/css" href="styles/id.css">
    <link rel="stylesheet" type="text/css" href="styles/queries.css">
    
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <script type="module" defer>
        import Main from './scripts/main.js';
        window.Main = Main;
    </script>
</head>

<body>
    <audio loop src="audio/lullaby.mp3" id="audio-lullaby"></audio>
    <audio loop src="audio/waken.mp3" id="audio-waken"></audio>
    <audio loop src="audio/fallen.mp3" id="audio-fallen"></audio>

    <p-splash-dialog content="PP" onkeydown="Main.handleEnter(event)" onclick="Main.run()" id="dialog"></p-splash-dialog>
    
    <header style="display: none;">
        <h1>PPGRAM%</h1>
        <a href="https://github.com/bloopsoup/PPGRAM" target="_blank" style="text-align: right;">GITHUB</a>
    </header>

    <main style="display: none;">
        <section aria-labelledby="picked-status">
            <div class="block">
                <img is="p-splash-image" src="images/git-doge/time.png" class="floating" id="picked-image">
                <h2 id="picked-status">loading...</h2>
            </div>
            <h3 style="color: rgb(255, 202, 237);" class="floating" id="picked-name"></h3>
            <h2 style="text-align: right;" id="picked-date"></h2>
        </section>

        <hr>

        <section aria-labelledby="stats-recent-header">
            <div class="row">
                <div class="column">
                     <h2 id="stats-recent-header">previous victims</h2>
                     <ol is="p-stats" id="stats-recent"></ol>
                </div>
                <img is="p-splash-image" src="images/git-doge/book.png" class="floating" id="stats-image">
            </div>
        </section>
    
        <hr>

        <section aria-labelledby="stats-summary-header">
            <div class="row">
                <div class="column">
                    <h2 id="stats-summary-header">stats</h2>
                    <ol is="p-stats" summarize class="floating" id="stats-summary"></ol>
                </div>  
                <figure is="p-pie-chart" aria-describedby="stats-summary" class="floating" id="stats-pie"></figure>
            </div>
        </section>

        <hr>

        <section aria-labelledby="stats-chart-header">
            <div class="row">
                <div class="column">
                    <h2 id="stats-chart-header">sus exchange</h2>
                    <p id="stats-chart-status">sus shares are at an all time low!</p>
                </div>
                <canvas is="p-line-chart" min="0" max="100" aria-describedby="stats-chart-status" id="stats-line-chart"></canvas>
            </div>
        </section>

        <hr>
    </main>
    
    <footer style="display: none;">
        <p>By using this website, you agree that POOPSICLE rigged the algorithm.</p>
    </footer>
</body>
</html>
