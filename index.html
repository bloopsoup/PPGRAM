<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPGRAM%</title>

    <link rel="stylesheet" type="text/css" href="scripts/display/styles.css">

    <link rel="stylesheet" type="text/css" href="styles/animations.css">
    <link rel="stylesheet" type="text/css" href="styles/containers.css">
    <link rel="stylesheet" type="text/css" href="styles/elements.css">
    <link rel="stylesheet" type="text/css" href="styles/fonts.css">
    <link rel="stylesheet" type="text/css" href="styles/id.css">
    <link rel="stylesheet" type="text/css" href="styles/queries.css">
    
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <script type="module" defer>
        import Main from './scripts/main.js';
        window.Main = Main;
    </script>
</head>

<body>
    <p-splash-dialog content="PP" onkeydown="Main.handleEnter(event)" onclick="Main.run()" id="intro-dialog"></p-splash-dialog>
    
    <header style="display: none;">
        <h1><a href="https://github.com/bloopsoup/PPGRAM" aria-label="github link" target="_blank">PPGRAM%</a></h1>
        <p-song-player songs="fallen,lullaby,relax,mint,rot,suim,away2" id="intro-song"></p-song-player>
    </header>

    <main style="display: none;">
        <!-- PICKED SECTION -->
        <section aria-labelledby="picked-header">
            <div class="block">
                <p-splash-image src="images/git-doge/time.png" class="floating" id="picked-image"></p-splash-image>
                <h2 id="picked-header">victim</h2>
            </div>
            <h3 class="floating" id="picked-name"></h3>
            <h2 id="picked-date"></h2>
        </section>

        <hr>

        <!-- RECENT SECTION -->
        <section aria-labelledby="recent-header">
            <div class="row">
                <div class="column">
                     <h2 id="recent-header">previous victims</h2>
                     <p-stats id="recent-list"></p-stats>
                </div>
                <p-splash-image src="images/git-doge/book.png" class="floating" id="recent-image"></p-splash-image>
            </div>
        </section>
    
        <hr>

        <!-- SUMMARY SECTION -->
        <section aria-labelledby="summary-header">
            <div class="row">
                <div class="column">
                    <h2 id="summary-header">stats</h2>
                    <p-stats summarize class="floating" id="summary-list"></p-stats>
                </div>  
                <p-pie-chart class="rotating" id="summary-pie"></p-pie-chart>
            </div>
        </section>

        <hr>

        <!-- EXCHANGE SECTION -->
        <section aria-labelledby="exchange-header">
            <div class="row">
                <div class="column">
                    <h2 id="exchange-header">sus exchange</h2>
                    <p id="exchange-text">sus shares are at an all time low!</p>
                </div>
                <p-line-chart min="0" max="100" id="exchange-line"></p-line-chart>
            </div>
        </section>

        <hr>
    </main>
    
    <footer style="display: none;">
        <p>By using this website, you agree that POOPSICLE rigged the algorithm.</p>
    </footer>
</body>
</html>
