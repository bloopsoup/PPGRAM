<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPGRAM%</title>

    <link rel="stylesheet" type="text/css" href="styles/animations.css">
    <link rel="stylesheet" type="text/css" href="styles/containers.css">
    <link rel="stylesheet" type="text/css" href="styles/elements.css">
    <link rel="stylesheet" type="text/css" href="styles/fonts.css">
    <link rel="stylesheet" type="text/css" href="styles/queries.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <script type="module" defer>
        import Main from './scripts/main.js';
        Main.init();
        window.Main = Main;
    </script>
</head>

<body>
    <div role="dialog" aria-modal="true" aria-labelledby="dialog-header" onkeydown="Main.handleEnter(event)" onclick="Main.run()" tabindex="-1" class="column" id="dialog">
        <h1 id="dialog-header" style="width: auto; font-size: 10rem;">PP</h1>
    </div>

    <audio loop src="audio/lullaby.mp3" id="audio-lullaby"></audio>
    <audio loop src="audio/waken.mp3" id="audio-waken"></audio>
    
    <header style="display: none;">
        <h1>PPGRAM%</h1>
        <a href="https://github.com/bloopsoup/PPGRAM" target="_blank" style="text-align: right;">GITHUB</a>
    </header>

    <main style="display: none;">
        <section aria-labelledby="picked-status">
            <div class="block">
                <p-splash-image src="images/git-doge/time.png" hidden id="picked-image"></p-splash-image>
                <h2 id="picked-status">loading...</h2>
            </div>
            <h3 style="color: rgb(255, 202, 237);" class="floating" id="picked-name"></h3>
            <h2 style="text-align: right;" id="picked-date"></h2>
        </section>

        <hr>

        <section aria-labelledby="stats-recent-header">
            <div class="row">
                <div class="column">
                     <h2 id="stats-recent-header">previous victims</h2>
                     <p-stats id="stats-recent"></p-stats>
                </div>
                <p-splash-image src="images/git-doge/book.png" id="stats-image"></p-splash-image>
            </div>
        </section>
    
        <hr>

        <section aria-labelledby="stats-summary-header">
            <div class="row">
                <div class="column">
                    <h2 id="stats-summary-header">stats</h2>
                    <p-stats class="floating" id="stats-summary" summarize></p-stats>
                </div>  
                <p-pie-chart class="floating" id="stats-pie"></pp-pie-chart>
            </div>
        </section>

        <hr>

        <section aria-labelledby="stats-chart-header stats-chart-subheader">
            <div class="row">
                <div class="column">
                    <h2 id="stats-chart-header">SUS</h2>
                    <h3 id="stats-chart-subheader" class="floating">exchange</h3>
                </div>
                <p-line-chart id="stats-line-chart"></p-line-chart>
            </div>
        </section>

        <hr>
    </main>
    
    <footer style="display: none;">
        <p>By using this website, you agree that POOPSICLE rigged the algorithm.</p>
    </footer>
</body>
</html>
