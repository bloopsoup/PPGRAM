<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPGRAM%</title>

    <link rel="stylesheet" type="text/css" href="styles/animations.css">
    <link rel="stylesheet" type="text/css" href="styles/containers.css">
    <link rel="stylesheet" type="text/css" href="styles/elements.css">
    <link rel="stylesheet" type="text/css" href="styles/fonts.css">
    <link rel="stylesheet" type="text/css" href="styles/queries.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <script src="scripts/main.js" type="module" defer></script>
</head>

<body>
    <header>
        <h1>PPGRAM%</h1>
        <a href="https://github.com/bloopsoup/PPGRAM" target="_blank" style="text-align: right;">GITHUB</a>
    </header>

    <main>
        <section aria-labelledby="picked-status">
            <h2 id="picked-status">loading...</h2>
            <h3 style="color: rgb(255, 202, 237);" class="floating" id="picked-name"></h3>
            <h2 style="text-align: right;" id="picked-date"></h2>
        </section>

        <hr>

        <section aria-labelledby="stats-recent-header">
            <h2 id="stats-recent-header">previous victims</h2>
            <p-stats id="stats-recent"></p-stats>
        </section>
    
        <hr>

        <section aria-labelledby="stats-summary-header">
            <div class="row">
                <div class="column">
                    <h2 id="stats-summary-header">stats</h2>
                    <p-stats id="stats-summary" summarize></p-stats>
                </div>  
                <p-pie-chart id="stats-pie"></pp-pie-chart>
            </div>
        </section>

        <hr>
    </main>
    
    <footer>
        <p>By using this website, you agree that POOPSICLE rigged the algorithm.</p>
    </footer>
</body>
</html>
