<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPGRAM%</title>

    <link rel="stylesheet" type="text/css" href="scripts/display/styles.css">

    <link rel="stylesheet" type="text/css" href="styles/animations.css">
    <link rel="stylesheet" type="text/css" href="styles/containers.css">
    <link rel="stylesheet" type="text/css" href="styles/elements.css">
    <link rel="stylesheet" type="text/css" href="styles/fonts.css">
    <link rel="stylesheet" type="text/css" href="styles/id.css">
    <link rel="stylesheet" type="text/css" href="styles/queries.css">

    <link rel="icon" type="image/png" href="images/favicon.png">

    <script type="module" defer>
        import Main from './scripts/main.js';
        window.Main = Main;
    </script>
</head>

<body>
    <p-splash-dialog content="PP" onkeydown="Main.handleEnter(event)" onclick="Main.run()" id="intro-dialog"></p-splash-dialog>

    <header style="display: none;">
        <h1><a href="https://github.com/bloopsoup/PPGRAM" aria-label="github link" target="_blank">PPGRAM%</a></h1>
        <p-song-player id="intro-song"></p-song-player>
    </header>

    <main style="display: none;">
        <!-- PICKED SECTION -->
        <section aria-labelledby="picked-header">
            <div class="block">
                <p-splash-image src="images/git-doge/time.png" class="floating" id="picked-image"></p-splash-image>
                <h2 id="picked-header">victim</h2>
            </div>
            <h3 class="floating" id="picked-name"></h3>
            <h2 id="picked-date"></h2>
        </section>

        <hr>

        <!-- SONGS SECTION -->
        <section aria-labelledby="peace-album-header">
            <div class="row">
                <div class="column">
                    <h2 id="peace-album-header">PEACE</h2>
                    <h3>TRACKS</h3>
                    <p-song-selector choices="fallen,lullaby,away2,yune3,waken,relax,sol,lime,frame" id="peace-album"></p-song-selector>
                </div>
                <p-splash-image src="images/git-doge/pp.png" class="floating side-image"></p-splash-image>
            </div>
        </section>

        <hr>

        <section aria-labelledby="up-album-header">
            <div class="row">
                <div class="column">
                    <h2 id="up-album-header">/\/\/\</h2>
                    <h3>TRACKS</h3>
                    <p-song-selector choices="mint,north,rot,crawl,clap" id="up-album"></p-song-selector>
                </div>
                <p-splash-image src="images/git-doge/pp.png" class="floating side-image"></p-splash-image>
            </div>
        </section>

        <hr>

        <section aria-labelledby="classic-album-header">
            <div class="row">
                <div class="column">
                    <h2 id="classic-album-header">cLASSIc</h2>
                    <h3>TRACKS</h3>
                    <p-song-selector choices="cee,cheese,suim,walk,pin,wound" id="classic-album"></p-song-selector>
                </div>
                <p-splash-image src="images/bloopsoup/classic.png" class="floating side-image"></p-splash-image>
            </div>
        </section>

        <hr>

        <section aria-labelledby="discount-album-header">
            <div class="row">
                <div class="column">
                    <h2 id="discount-album-header">disCOUNT</h2>
                    <h3>TRACKS</h3>
                    <p-song-selector choices="incense,banjo,waken1,relax1" id="discount-album"></p-song-selector>
                </div>
                <p-splash-image src="images/bloopsoup/classic.png" class="floating side-image"></p-splash-image>
            </div>
        </section>

        <hr>

        <!-- RECENT SECTION -->
        <section aria-labelledby="recent-header">
            <div class="row">
                <div class="column">
                    <h2 id="recent-header">previous victims</h2>
                    <p-stats id="recent-list"></p-stats>
                </div>
                <p-splash-image src="images/git-doge/book.png" class="floating side-image"></p-splash-image>
            </div>
        </section>

        <hr>

        <!-- SUMMARY SECTION -->
        <section aria-labelledby="summary-header">
            <div class="row">
                <div class="column">
                    <h2 id="summary-header">stats</h2>
                    <p-stats summarize class="floating" id="summary-list"></p-stats>
                </div>
                <p-pie-chart class="rotating" id="summary-pie"></p-pie-chart>
            </div>
        </section>

        <hr>

        <!-- EXCHANGE SECTION -->
        <section aria-labelledby="exchange-header">
            <div class="row">
                <div class="column">
                    <h2 id="exchange-header">SUS exchange</h2>
                    <p id="exchange-text">the authorities have been notified.</p>
                </div>
                <p-line-chart min="0" max="100" id="exchange-line"></p-line-chart>
            </div>
        </section>

        <hr>
    </main>

    <footer style="display: none;">
        <p>By using this website, you agree that POOPSICLE rigged the algorithm.</p>
    </footer>
</body>

</html>
